name: bug
description: something broke or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: what happened
      description: and what you expected instead. a screenshot helps
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: version
      description: the plugin version (`version` in `Plugins/heatsync/info.json`) and your chatterino version, stable or nightly
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: os
      description: for example windows 11, or arch linux
    validations:
      required: true
